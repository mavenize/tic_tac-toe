<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game">
      <!-- Player name form, shown before the game starts (T10) -->
      <form class="setup" id="setup-form">
        <label for="name-x">Player X</label>
        <input type="text" id="name-x" maxlength="20" placeholder="Player X" />

        <label for="name-o">Player O</label>
        <input type="text" id="name-o" maxlength="20" placeholder="Player O" />

        <button type="submit">Start</button>
      </form>

      <!-- Everything below stays hidden until Start is pressed (T10) -->
      <div class="play" id="play" hidden>
        <!-- Game board: 9 cells rendered by DisplayController (T7) -->
        <div class="board" id="board"></div>

        <!-- Whose turn / round result (T9) -->
        <p class="status" id="status"></p>

        <!-- Running scoreboard: NAME (X) | TIE | NAME (O) (T11) -->
        <section class="scoreboard" id="scoreboard"></section>

        <!-- Next Round / Restart buttons (T10) -->
        <div class="controls" id="controls">
          <button type="button" id="next-round" disabled>Next Round</button>
          <button type="button" id="restart">Restart</button>
        </div>
      </div>
    </main>
  </body>
</html>
